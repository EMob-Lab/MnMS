name: Deploy to PyPI & container registry

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags like v1.2.3

jobs:

  check-version:
    name: Check git tag
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7

      - name: Ensure git tag corresponds to project version
        run: |
          project_version="v$(python3 .github/scripts/get_project_version.py)"
          echo "Git tag = [$GITHUB_REF_NAME]"
          echo "Project version = [$project_version]"
          if [[ "$GITHUB_REF_NAME" != "$project_version" ]]; then
            echo "Mismatch between git tag and project version (in pyproject.toml), aborting deployment..."
            exit 1
          fi

  build:
    name: Build wheel & source distribution
    runs-on: ubuntu-latest
    needs:
      - check-version

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x' # The exact Python version is not important here.

      - name: Build wheel & sdist
        run: |
          pip install --group distrib
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            ./dist/*.tar.gz
            ./dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - check-version
      - build

    environment:
      name: pypi-env
      url: https://pypi.org/project/MnMS/

    permissions:
      id-token: write # Required for authentication through OIDC.

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-ghcr:
    name: Publish (Docker image) to container registry
    runs-on: ubuntu-latest
    needs:
      - check-version
      - build

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: emob-lab/mnms-docker

    environment:
      name: ghcr-env
      url: https://github.com/EMob-Lab/MnMS/pkgs/container/mnms-docker

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - uses: docker/setup-qemu-action@v4 # Needed to build the arm64 image version from a linux/amd64 runner.
      - uses: docker/setup-buildx-action@v4

      - name: Read image labels
        id: labels
        run: |
          {
            echo 'labels<<EOF'
            grep -v -e '^\s*#' -e '^\s*$' docker/image_src/labels.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compute image tags and metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index # Needed for metadata to be properly set on multi-platform image.
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The image version is the MnMS version, taken from the git tag without its 'v' prefix.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha
          labels: ${{ steps.labels.outputs.labels }}
          annotations: ${{ steps.labels.outputs.labels }}

      - name: Build image and push
        uses: docker/build-push-action@v7
        with:
          context: docker/image_src
          build-contexts: wheel_dir=dist # Directory containing the MnMS wheel to install in the image.
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          provenance: false # Avoid the extra 'unknown/unknown' entry in the image index.
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
